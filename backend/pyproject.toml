[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "redis>=5.2,<7", "rq>=2.2,<3",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1",
  "numpy>=2,<3", "pypdf>=6,<7", "pgvector>=0.4,<0.5", "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real migrated PostgreSQL database and Redis"]
